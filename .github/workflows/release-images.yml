name: Tests and container images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to use for a manual image build
        required: false
        default: 0.0.0-manual
      push_images:
        description: Push manually built images to GHCR
        required: false
        type: boolean
        default: false
      image_target:
        description: Image target to build manually
        required: false
        type: choice
        options:
          - replicator
          - overpass
          - both
        default: replicator

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q radio_overpass
      - name: Validate shell entrypoints
        run: bash -n docker/overpass/entrypoint.sh docker/replicator/entrypoint.sh docker/replicator/initial-import.sh docker/replicator/apply-minute.sh docker/replicator/rebuild-entrypoint.sh docker/replicator/planet-bootstrap.sh docker/replicator/initial-staging.sh docker/replicator/full-pbf-entrypoint.sh
      - name: Validate Compose definition
        run: docker compose config --quiet

  image-metadata:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push_images }}
          INPUT_TARGET: ${{ inputs.image_target }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == release ]]; then
            raw_version="$RELEASE_TAG"
            push_images=true
            targets='["replicator"]'
          elif [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            raw_version="${GITHUB_REF#refs/tags/}"
            push_images=true
            targets='["replicator","overpass"]'
          else
            raw_version="${INPUT_VERSION:-0.0.0-manual}"
            push_images="${INPUT_PUSH:-false}"
            case "${INPUT_TARGET:-replicator}" in
              replicator) targets='["replicator"]' ;;
              overpass) targets='["overpass"]' ;;
              both) targets='["replicator","overpass"]' ;;
              *) echo "Unknown image target: $INPUT_TARGET" >&2; exit 1 ;;
            esac
          fi
          if [[ ! "$raw_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a semantic version: $raw_version" >&2
            exit 1
          fi
          version="${raw_version#v}"
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "owner=$owner"
            echo "version=$version"
            echo "push=$push_images"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"

  images:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: image-metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.image-metadata.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        if: needs.image-metadata.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ needs.image-metadata.outputs.push == 'true' }}
          tags: |
            ghcr.io/${{ needs.image-metadata.outputs.owner }}/overpass-radio-${{ matrix.target }}:${{ needs.image-metadata.outputs.version }}
            ghcr.io/${{ needs.image-metadata.outputs.owner }}/overpass-radio-${{ matrix.target }}:latest
          cache-from: type=gha,scope=overpass-radio-builder
          cache-to: type=gha,mode=max,scope=overpass-radio-builder
