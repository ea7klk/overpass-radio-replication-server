ServerName localhost

ScriptAlias /api/ "/opt/overpass/cgi-bin/"
<Directory "/opt/overpass/cgi-bin/">
    AllowOverride None
    Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
    Require env radio_referrer_allowed
    SetEnv OVERPASS_DB_DIR __OVERPASS_DB_DIR__
</Directory>

<IfModule mod_headers.c>
    Header always set Vary "Origin"
    Header always set Access-Control-Allow-Origin "%{HTTP:Origin}i" env=radio_cors_allowed
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS" env=radio_cors_allowed
    Header always set Access-Control-Allow-Headers "Content-Type, Accept, X-Requested-With" env=radio_cors_allowed
    Header always set Access-Control-Max-Age "600" env=radio_cors_allowed
</IfModule>
