apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: overpass-radio-overpass
  namespace: overpass-radio
  labels:
    app.kubernetes.io/name: overpass-radio-api
spec:
  serviceName: overpass
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: overpass-radio-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overpass-radio-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      containers:
      - name: overpass
        image: ghcr.io/ea7klk/overpass-radio-overpass:0.1.10
        imagePullPolicy: IfNotPresent
        env:
        - name: ALLOWED_ORIGINS
          value: ""
        - name: OVERPASS_DB_ROOT
          value: /srv/overpass-radio/db
        - name: OVERPASS_STATE_DIR
          value: /srv/overpass-radio/state
        - name: OVERPASS_READY_SLOT_FILE
          value: /srv/overpass-radio/state/ready-slot
        - name: OVERPASS_ACTIVE_SLOT_FILE
          value: /srv/overpass-radio/state/active-slot
        - name: OVERPASS_BUILDING_SLOT_FILE
          value: /srv/overpass-radio/state/building-slot
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - >-
              slot=blue; case "$(cat /etc/hostname)" in *-1) slot=green;; esac;
              test "$(cat /srv/overpass-radio/state/active-slot 2>/dev/null)" = "$slot" &&
              curl --noproxy '*' --fail --silent --get http://127.0.0.1/api/interpreter
              --data-urlencode 'data=[out:json];node(1);out;' | grep -q '"version"'
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - >-
              curl --noproxy '*' --fail --silent --get
              http://127.0.0.1/api/interpreter
              --data-urlencode 'data=[out:json];node(1);out;' |
              grep -q '"version"'
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 12
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - >-
              curl --noproxy '*' --fail --silent --get
              http://127.0.0.1/api/interpreter
              --data-urlencode 'data=[out:json];node(1);out;' |
              grep -q '"version"'
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 8640
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - name: databases
          mountPath: /srv/overpass-radio/db
        - name: state
          mountPath: /srv/overpass-radio/state
        - name: apache-cors
          mountPath: /etc/apache2/conf-enabled/zz-overpass-radio-cors.conf
          subPath: zz-overpass-radio-cors.conf
          readOnly: true
      volumes:
      - name: databases
        persistentVolumeClaim:
          claimName: overpass-radio-databases
      - name: state
        persistentVolumeClaim:
          claimName: overpass-radio-state
      - name: apache-cors
        configMap:
          name: overpass-radio-apache-cors
          defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overpass-radio-replication
  namespace: overpass-radio
  labels:
    app.kubernetes.io/name: overpass-radio-replication
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: overpass-radio-replication
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overpass-radio-replication
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      initContainers:
      - name: download-fresh-planet
        image: ghcr.io/ea7klk/overpass-radio-replicator:0.1.15
        imagePullPolicy: IfNotPresent
        command: [/usr/local/bin/radio-overpass-planet-bootstrap]
        env:
        - name: PLANET_METADATA_FILE
          value: /srv/planet/planet-download.json
        volumeMounts:
        - name: planet
          mountPath: /srv/planet
      - name: initialize-filtered-staging
        image: ghcr.io/ea7klk/overpass-radio-replicator:0.1.15
        imagePullPolicy: IfNotPresent
        command: [/usr/local/bin/radio-overpass-initial-staging]
        env:
        - name: PLANET_PBF
          value: /srv/planet/planet-latest.osm.pbf
        - name: FILTERED_DIR
          value: /srv/filtered
        - name: STAGING_DB_DIR
          value: /srv/db/blue
        - name: INITIAL_SLOT
          value: blue
        - name: STATE_DIR
          value: /srv/state
        - name: TAG_KEY_PREFIX
          value: communication:amateur_radio
        volumeMounts:
        - name: planet
          mountPath: /srv/planet
        - name: filtered
          mountPath: /srv/filtered
        - name: databases
          mountPath: /srv/db
        - name: state
          mountPath: /srv/state
      containers:
      - name: full-pbf-replication
        image: ghcr.io/ea7klk/overpass-radio-replicator:0.1.15
        imagePullPolicy: IfNotPresent
        command: [/usr/local/bin/radio-overpass-full-pbf-entrypoint]
        env:
        - name: CONFIG_PATH
          value: /etc/overpass-radio.json
        resources:
          requests:
            cpu: 1
            memory: 2Gi
        volumeMounts:
        - name: planet
          mountPath: /srv/overpass-radio/planet
        - name: raw-changes
          mountPath: /srv/overpass-radio/raw
        - name: filtered
          mountPath: /srv/overpass-radio/filtered
        - name: databases
          mountPath: /srv/overpass-radio/db
        - name: state
          mountPath: /srv/overpass-radio/state
        - name: config
          mountPath: /etc/overpass-radio.json
          subPath: overpass-radio.json
          readOnly: true
      volumes:
      - name: planet
        persistentVolumeClaim:
          claimName: overpass-radio-planet
      - name: raw-changes
        persistentVolumeClaim:
          claimName: overpass-radio-raw-changes
      - name: filtered
        persistentVolumeClaim:
          claimName: overpass-radio-filtered
      - name: databases
        persistentVolumeClaim:
          claimName: overpass-radio-databases
      - name: state
        persistentVolumeClaim:
          claimName: overpass-radio-state
      - name: config
        configMap:
          name: overpass-radio-config
          defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: overpass
  namespace: overpass-radio
  labels:
    app.kubernetes.io/name: overpass-radio-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: overpass-radio-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: overpass-radio
  namespace: overpass-radio
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`overpass.ea7klk.es`)
    services:
    - name: overpass
      port: 80
  tls:
    certResolver: acmeresolver
