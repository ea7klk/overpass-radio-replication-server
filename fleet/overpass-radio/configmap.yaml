apiVersion: v1
kind: ConfigMap
metadata:
  name: overpass-radio-config
  namespace: overpass-radio
data:
  overpass-radio.json: |
    {
      "db_dir": "/srv/overpass-radio/db",
      "overpass_update_from_dir": "/opt/overpass/bin/update_from_dir",
      "work_dir": "/srv/overpass-radio/work-from-pbf",
      "osc_inspection_dir": "/srv/overpass-radio/osc-inspection-from-pbf",
      "catalog_file": "/srv/overpass-radio/catalog-from-pbf.json",
      "filtered_replica_dir": "/srv/overpass-radio/filtered-replica",
      "dependency_queue_dir": "/srv/overpass-radio/dependency-queue",
      "membership_cursor_file": "/srv/overpass-radio/membership-replicate-id",
      "writer_lock": "/srv/overpass-radio/.database-writer.lock",
      "minute_base_url": "https://planet.openstreetmap.org/replication/minute/",
      "minute_update_batch_size": 100,
      "poll_seconds": 60,
      "retry_initial_seconds": 15,
      "retry_max_seconds": 900,
      "overpass_query_url": "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
      "overpass_query_timeout": 180,
      "overpass_query_retries": 3,
      "dependency_query_batch_size": 20,
      "dependency_query_workers": 4,
      "dependency_poll_seconds": 30,
      "tag_key_prefix": "communication:amateur_radio",
      "meta_mode": "--meta=no"
    }
