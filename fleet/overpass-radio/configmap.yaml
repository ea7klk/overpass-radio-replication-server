apiVersion: v1
kind: ConfigMap
metadata:
  name: overpass-radio-config
  namespace: overpass-radio
data:
  overpass-radio.json: |
    {
      "db_dir": "/srv/overpass-radio/db",
      "rebuild_db_dir": "/srv/overpass-radio/db-rebuild",
      "overpass_update_from_dir": "/opt/overpass/bin/update_from_dir",
      "work_dir": "/srv/overpass-radio/rebuild-work",
      "osc_inspection_dir": "/srv/overpass-radio/rebuild-osc-inspection",
      "catalog_file": "/srv/overpass-radio/rebuild-catalog.json",
      "snapshot_metadata_file": "/srv/overpass-radio/rebuild-snapshot.json",
      "state_file": "/srv/overpass-radio/rebuild-state.json",
      "official_replica_dir": "/srv/overpass-radio/rebuild-replica",
      "cutover_requested_file": "/srv/overpass-radio/cutover-requested",
      "cutover_ready_file": "/srv/overpass-radio/cutover-ready",
      "cutover_complete_file": "/srv/overpass-radio/cutover-complete",
      "phase_reset_requested_file": "/srv/overpass-radio/phase-reset-requested",
      "phase_reset_complete_file": "/srv/overpass-radio/phase-reset-complete",
      "minute_base_url": "https://planet.openstreetmap.org/replication/minute/",
      "daily_base_url": "https://planet.openstreetmap.org/replication/day/",
      "hour_base_url": "https://planet.openstreetmap.org/replication/hour/",
      "poll_seconds": 60,
      "retry_initial_seconds": 15,
      "retry_max_seconds": 900,
      "overpass_query_url": "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
      "overpass_query_timeout": 180,
      "overpass_query_retries": 3,
      "dependency_query_workers": 4,
      "official_apply_timeout_seconds": 3600,
      "tag_key_prefix": "communication:amateur_radio",
      "tag_only_prefilter": true,
      "meta_mode": "--meta=no"
    }
