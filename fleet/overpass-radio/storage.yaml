apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overpass-radio-planet
  namespace: overpass-radio
  labels:
    app.kubernetes.io/component: full-planet-pbf
  annotations:
    overpass.spainip.es/purpose: full-planet-pbf-and-torrent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 220Gi
  storageClassName: local-path
  volumeMode: Filesystem
---
