services:
  planet-bootstrap:
    build:
      context: .
      target: replicator
    image: ${REPLICATOR_IMAGE:-ghcr.io/ea7klk/overpass-radio-replicator:latest}
    restart: "no"
    command: [/usr/local/bin/radio-overpass-planet-bootstrap]
    volumes:
      - planet:/srv/planet

  overpass:
    build:
      context: .
      target: overpass
    image: ${OVERPASS_IMAGE:-ghcr.io/ea7klk/overpass-radio-overpass:latest}
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      OVERPASS_DB_ROOT: /srv/overpass-radio/db
      OVERPASS_STATE_DIR: /srv/overpass-radio/state
      OVERPASS_READY_SLOT_FILE: /srv/overpass-radio/state/ready-slot
      OVERPASS_ACTIVE_SLOT_FILE: /srv/overpass-radio/state/active-slot
      OVERPASS_BUILDING_SLOT_FILE: /srv/overpass-radio/state/building-slot
    ports:
      - "${OVERPASS_PORT:-8080}:80"
    volumes:
      - databases:/srv/overpass-radio/db
      - state:/srv/overpass-radio/state
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --noproxy '*' --fail --silent --get http://127.0.0.1/api/interpreter
          --data-urlencode 'data=[out:json];node(0);out;' | grep -q '"version"'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  scheduled-rebuild:
    build:
      context: .
      target: replicator
    image: ${REPLICATOR_IMAGE:-ghcr.io/ea7klk/overpass-radio-replicator:latest}
    restart: "no"
    command: [/usr/local/bin/radio-overpass-scheduled-rebuild]
    depends_on:
      planet-bootstrap:
        condition: service_completed_successfully
      overpass:
        condition: service_started
    environment:
      CONFIG_PATH: /etc/overpass-radio.json
    volumes:
      - planet:/srv/overpass-radio/planet
      - filtered:/srv/overpass-radio/filtered
      - databases:/srv/overpass-radio/db
      - state:/srv/overpass-radio/state
      - ./docker/replicator/config.json:/etc/overpass-radio.json:ro

volumes:
  planet:
  filtered:
  databases:
  state:
